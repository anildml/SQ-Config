services:
  sq_db:
    image: mongo:6.0.27-nanoserver
    container_name: sq_db
    restart: always
    ports:
      - 12279:27017 # Expose MongoDB on the default port
    environment:
      MONGO_INITDB_ROOT_USERNAME: dmlroot # Set the admin username
      MONGO_INITDB_ROOT_PASSWORD: guzelliginbesparaetmez # Set the admin password
    volumes:
      - ./db/mongo-data:/data/db # Persist MongoDB data
      - ./db/mongo-config:/data/configdb # Persist MongoDB configuration
      - ./db/db.dump:/db.dump
  sq_core:
    image: golang:1.25-alpine
    container_name: sq_core
    environment:
      DB_URL: sq_db:27017
      DB_USERNAME: dmlroot
      DB_PASSWORD: guzelliginbesparaetmez
    ports:
      - 12280:8080
    volumes:
      - ../SQ-Core:/service
    command:
      - /service/app

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local