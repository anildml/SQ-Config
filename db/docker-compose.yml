services:
  sq_db:
    image: mongo:8.2.3
    container_name: sq_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: dmlroot # Set the admin username
      MONGO_INITDB_ROOT_PASSWORD: guzelliginbesparaetmez # Set the admin password
    volumes:
      - ./mongo-data:/data/db # Persist MongoDB data
      - ./mongo-config:/data/configdb # Persist MongoDB configuration
      - ./db.dump:/db.dump
    network_mode: host

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local